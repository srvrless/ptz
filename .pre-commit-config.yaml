repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.13 # Use the latest version from the [ruff-pre-commit GitHub repo](https://github.com/astral-sh/ruff-pre-commit)
  hooks:
    # Run the linter with auto-fixes.
    - id: ruff-check
      args: [ --fix ]
      # Optional: specify file types if not all files are Python
      types_or: [ python, pyi ]

    # Run the formatter.
    - id: ruff-format
      # Optional: specify file types if not all files are Python
      types_or: [ python, pyi ]
